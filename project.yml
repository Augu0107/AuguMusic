name: AuguMusic
options:
  bundleIdPrefix: com.augugames
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.4"
    CURRENT_PROJECT_VERSION: "14"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
packages:
  SFBAudioEngine:
    url: https://github.com/sbooth/SFBAudioEngine
    from: 0.9.1
targets:
  AuguMusic:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
    dependencies:
      - package: SFBAudioEngine
      - target: AuguMusicWidget
    entitlements:
      path: Support/AuguMusic.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.augugames.augumusic
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: AuguMusic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: false
        NSPhotoLibraryUsageDescription: Serve per scegliere una copertina dalle tue foto.
        CFBundleURLTypes:
          - CFBundleURLName: com.augugames.augumusic
            CFBundleURLSchemes: [augumusic]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.augugames.augumusic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MAIN_APP"
        ENABLE_PREVIEWS: "YES"

  AuguMusicWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    entitlements:
      path: Support/AuguMusicWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.augugames.augumusic
    info:
      path: Support/Widget-Info.plist
      properties:
        CFBundleDisplayName: AuguMusic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.augugames.augumusic.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
