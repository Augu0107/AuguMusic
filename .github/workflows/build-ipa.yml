name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        run: xcodegen generate

      - name: Compila (senza firma)
        run: |
          set -o pipefail
          xcodebuild \
            -project AuguMusic.xcodeproj \
            -scheme AuguMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: unre|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/AuguMusic.app

      - name: Crea l'.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AuguMusic.app Payload/
          zip -qry AuguMusic.ipa Payload

      - name: Carica l'.ipa
        uses: actions/upload-artifact@v4
        with:
          name: AuguMusic-ipa
          path: AuguMusic.ipa

      - name: Carica il log di compilazione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
