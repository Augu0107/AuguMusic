name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        run: xcodegen generate

      - name: Compila (senza firma)
        run: |
          set +e
          xcodebuild \
            -project AuguMusic.xcodeproj \
            -scheme AuguMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1
          status=$?
          # Gli errori diventano annotazioni leggibili anche senza scaricare il log
          grep -E "^/.*: error: " xcodebuild.log | sort -u | head -40 | while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1 | sed "s|$GITHUB_WORKSPACE/||")
            lineno=$(echo "$line" | cut -d: -f2)
            msg=$(echo "$line" | sed -E 's/^[^:]+:[0-9]+:[0-9]+: error: //')
            echo "::error file=$file,line=$lineno::$msg"
          done
          if [ $status -ne 0 ]; then
            grep -E "error:|BUILD FAILED" xcodebuild.log | grep -vE "^/.*: error: " | sort -u | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -40 xcodebuild.log
            exit 1
          fi
          test -d build/Build/Products/Release-iphoneos/AuguMusic.app

      - name: Firma ad-hoc con i permessi (App Group per il widget)
        run: |
          APP=build/Build/Products/Release-iphoneos/AuguMusic.app
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -exec codesign -f -s - {} \;
          fi
          if [ -d "$APP/PlugIns/AuguMusicWidget.appex" ]; then
            codesign -f -s - --entitlements Support/AuguMusicWidget.entitlements "$APP/PlugIns/AuguMusicWidget.appex"
          fi
          codesign -f -s - --entitlements Support/AuguMusic.entitlements "$APP"
          codesign -d --entitlements - "$APP" || true

      - name: Crea l'.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AuguMusic.app Payload/
          zip -qry AuguMusic.ipa Payload
          ls -la AuguMusic.ipa

      - name: Carica l'.ipa
        uses: actions/upload-artifact@v4
        with:
          name: AuguMusic-ipa
          path: AuguMusic.ipa

      - name: Carica il log di compilazione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
